name: Gerar executável Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependências
        run: pip install -r requirements-dev.txt
      - name: Testes
        run: python -m pytest -q tests
      - name: PyInstaller
        run: pyinstaller --noconfirm --clean IndexadorPDF.spec
      - name: Compactar
        shell: pwsh
        run: |
          Copy-Item README.md dist/IndexadorPDF/
          Compress-Archive -Path dist/IndexadorPDF -DestinationPath IndexadorPDF-windows.zip
          (Get-FileHash IndexadorPDF-windows.zip -Algorithm SHA256).Hash | Out-File IndexadorPDF-windows.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: IndexadorPDF-windows
          path: |
            IndexadorPDF-windows.zip
            IndexadorPDF-windows.zip.sha256
      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            IndexadorPDF-windows.zip
            IndexadorPDF-windows.zip.sha256
